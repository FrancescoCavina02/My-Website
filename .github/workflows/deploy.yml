name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # Deploy Backend to Render
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK not set - skipping backend deployment"
            exit 0
          fi

          echo "🚀 Triggering Render deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "✅ Deployment triggered successfully"

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 60 seconds for deployment to start..."
          sleep 60

      - name: Health check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️ BACKEND_URL not set - skipping health check"
            exit 0
          fi

          echo "🏥 Checking backend health..."
          max_attempts=10
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."

            if curl -f -s "$BACKEND_URL/health" > /dev/null; then
              echo "✅ Backend is healthy!"
              exit 0
            fi

            echo "❌ Health check failed, retrying in 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "❌ Backend health check failed after $max_attempts attempts"
          exit 1

  # Deploy Frontend to Vercel
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend
        continue-on-error: true

      - name: Alternative - Manual Vercel Deploy
        if: failure()
        run: |
          echo "⚠️ Automated Vercel deployment failed"
          echo "📝 To deploy manually:"
          echo "  1. cd frontend"
          echo "  2. npx vercel --prod"
          echo ""
          echo "Or push to Vercel's GitHub integration will auto-deploy"

  # Post-deployment checks
  post-deployment:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          echo "📊 Deployment Status:"
          echo "  Backend: ${{ needs.deploy-backend.result }}"
          echo "  Frontend: ${{ needs.deploy-frontend.result }}"

          if [[ "${{ needs.deploy-backend.result }}" == "success" ]] && \
             [[ "${{ needs.deploy-frontend.result }}" == "success" ]]; then
            echo "✅ All deployments successful!"
          else
            echo "⚠️ Some deployments may have issues"
          fi

      - name: Notify on Slack (optional)
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "ℹ️ SLACK_WEBHOOK not configured - skipping notification"
            exit 0
          fi

          STATUS="✅ Success"
          if [[ "${{ needs.deploy-backend.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-frontend.result }}" != "success" ]]; then
            STATUS="⚠️ Partial Failure"
          fi

          curl -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Deployment $STATUS - Backend: ${{ needs.deploy-backend.result }}, Frontend: ${{ needs.deploy-frontend.result }}\"}"
